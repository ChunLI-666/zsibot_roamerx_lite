# Opt-in overlay, merged after the selected deployment parameters only when
# planner_backend:=smac_lattice. Keep deployment geometry and speed limits;
# explicitly cover the padded rectangle in both inflation layers.
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      # Omni primitives already encode their translations; this expansion
      # option only applies to non-Omni lattices.
      allow_reverse_expansion: false
      cache_obstacle_heuristic: false
      # Keep the SE2 orientations generated by the collision-aware search.
      smooth_path: false
      # lattice_filepath is filled from the validated launch argument.

global_costmap:
  global_costmap:
    ros__parameters:
      # Additional planner-only margin selected by the frozen old-map SE2
      # probe: .01 retained sampled rectangle/cell overlaps, .035 produced
      # clear aligned/diagonal reference paths against the unchanged .62x.32m
      # execution-footprint oracle. This is a software planning margin, not a
      # measured physical leg envelope; local padding remains unchanged.
      footprint_padding: 0.035
      # These plugins run in the independent upstream process, never in the
      # fork component container. Keep the deployment's map/frame/scan geometry.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.40
        cost_scaling_factor: 3.0

bt_navigator:
  ros__parameters:
    # BT request-response wait, in milliseconds: Action goal ACK and service
    # response share this default. This is not an algorithm time budget and
    # does not repair late-goal cancellation/cleanup.
    default_server_timeout: 1000

controller_server:
  ros__parameters:
    FollowPath:
      PathAlignCritic:
        use_path_orientations: true
