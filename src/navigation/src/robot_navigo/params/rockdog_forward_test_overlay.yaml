# Forward-motion field test; shared feature code, legacy command protocol explicitly selected.
controller_server:
  ros__parameters:
    progress_checker:
      plugin: navigo_path_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.2
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: navigo_path_controller::StoppedGoalChecker
      stateful: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
    FollowPath:
      vx_min: 0.0
      vy_max: 0.0
      forward_alignment:
        enabled: true
        entry_angle: 0.7
        exit_angle: 0.05
        lookahead_distance: 0.5
        max_angular_velocity: 0.1
        min_angular_velocity: 0.02
        angular_acceleration: 0.2
        minimum_forward_velocity: 0.05
        xy_hysteresis: 0.05
        rotation_collision_step: 0.02
        stopped_linear_velocity: 0.02
      vx_max: 0.15
      wz_max: 0.1
      motion_model: Omni
      iteration_count: 1
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    goal_checker_plugins:
    - general_goal_checker
    progress_checker_plugin: progress_checker
    enable_epoch_contract: false
    enable_epoch_backup: false
velocity_smoother:
  ros__parameters:
    max_velocity:
    - 0.15
    - 0.0
    - 0.1
    min_velocity:
    - 0.0
    - 0.0
    - -0.1
    enable_epoch_contract: false
behavior_server:
  ros__parameters:
    behavior_plugins:
    - wait
bt_navigator:
  ros__parameters:
    enable_epoch_contract: false
    enable_epoch_backup_recovery: false
nav_safety_gate:
  ros__parameters:
    enable_epoch_contract: false
