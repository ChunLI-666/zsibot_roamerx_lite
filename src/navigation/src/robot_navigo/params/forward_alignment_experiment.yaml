# Experimental overlay; load AFTER navigo_params.yaml. Not a complete bringup file.
# CPU/SE2 validation does not certify the physical leg envelope or SDK response.
controller_server:
  ros__parameters:
    progress_checker:
      plugin: "navigo_path_controller::PoseProgressChecker"
      required_movement_radius: 0.15
      required_movement_angle: 0.2
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "navigo_path_controller::StoppedGoalChecker"
      stateful: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
    FollowPath:
      vx_min: 0.0
      vy_max: 0.0
      forward_alignment:
        enabled: true
        entry_angle: 0.70
        exit_angle: 0.05
        lookahead_distance: 0.5
        max_angular_velocity: 0.1
        min_angular_velocity: 0.02
        angular_acceleration: 0.2
        minimum_forward_velocity: 0.05
        xy_hysteresis: 0.05
        rotation_collision_step: 0.02
        stopped_linear_velocity: 0.02
