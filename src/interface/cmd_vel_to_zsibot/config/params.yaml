# cmd_vel_to_zsibot parameters
# Copyright 2024 ZsiBot Team
#
# Network Setup (RK3588/NanoPC + ZSL-1 Robot):
#   - NanoPC eth0: 192.168.168.2 (connects to robot control board)
#   - Robot control board: 192.168.168.168
#   - SDK port: 43988

cmd_vel_to_zsibot:
  ros__parameters:
    # Network configuration (matching yz_robot_ctrl)
    local_ip: "192.168.168.2"    # RK3588/NanoPC eth0 IP
    local_port: 43988            # SDK port
    robot_ip: "192.168.168.168"  # Robot control board IP
    
    # Velocity limits (m/s and rad/s)
    max_linear_x: 0.15           # Match yz_robot_ctrl MAX_LINEAR_SPEED (m/s)
    max_linear_y: 0.15           # Match yz_robot_ctrl MAX_STRAFE_SPEED (m/s)
    max_angular_z: 0.25          # Match yz_robot_ctrl MAX_YAW_RATE (rad/s)
    
    # Timing parameters
    cmd_timeout: 0.5             # Command timeout in seconds (send zero once if no cmd received)
    command_check_rate: 20.0     # Rate to check pending cmd_vel and timeout state (Hz)
    status_rate: 1.0             # Battery/connectivity polling rate (Hz)
    min_command_interval: 1.0    # Minimum interval between non-zero SDK move() calls (s)
    command_epsilon: 0.001       # Velocity delta required before resending move()
    
    # Topic configuration
    cmd_vel_topic: "cmd_vel"     # Input velocity command topic
    
    # Robot behavior
    auto_standup: true          # Automatically stand up robot on node startup
