# Pre-registered Matrix open-area dynamic profile; measured native policy response is not exact SI tracking.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: REQUIRED_AT_PREPARE
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins:
    - GridBased
    expected_planner_frequency: 0.5
    costmap_update_timeout: 1.0
    GridBased:
      plugin: official_lattice_rpp_adapter::CheckedLattice
      lattice_filepath: REQUIRED_AT_PREPARE
      tolerance: 0.0
      smooth_path: false
      allow_unknown: false
      allow_reverse_expansion: false
      analytic_expansion_max_length: 0.0
      rotation_penalty: 1.0
      lookup_table_size: 1.0
      cache_obstacle_heuristic: false
      max_planning_time: 2.0
      max_iterations: 1000000
      terminal_checking_interval: 500
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    odom_topic: /odom
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.0
    enable_stamped_cmd_vel: false
    progress_checker_plugins:
    - Progress
    goal_checker_plugins:
    - Checker
    controller_plugins:
    - FollowPath
    Progress:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 10.0
    Checker:
      plugin: official_lattice_rpp_adapter::FeasibleGoalChecker
      controller_name: FollowPath
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.08
      stateful: false
    FollowPath:
      plugin: official_lattice_rpp_adapter::FeasibleRPP
      rpp:
        desired_linear_vel: 0.4
        lookahead_dist: 0.25
        min_lookahead_dist: 0.15
        max_lookahead_dist: 0.35
        use_velocity_scaled_lookahead_dist: false
        lookahead_time: 1.5
        min_approach_linear_velocity: 0.4
        approach_velocity_scaling_dist: 0.3
        regulated_linear_scaling_min_speed: 0.4
        use_rotate_to_heading: true
        rotate_to_heading_angular_vel: 0.3
        rotate_to_heading_min_angle: 0.5
        max_angular_accel: 6.0
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        transform_tolerance: 0.15
        allow_reversing: false
        stateful: false
        use_fixed_curvature_lookahead: false
        interpolate_curvature_after_goal: false
        max_robot_pose_search_dist: 3.0
        cost_scaling_dist: 0.3
        inflation_cost_scaling_factor: 3.0
      odom_timeout: 0.3
      sweep_horizon: 1.0
      allow_static_path_transform: true
      handler:
        enforce_path_rotation: true
        enforce_path_inversion: true
        inversion_xy_tolerance: 0.06
        inversion_yaw_tolerance: 0.08
        minimum_rotation_angle: 0.05
        prune_distance: 2.0
        max_robot_pose_search_dist: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.01
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.15
      rolling_window: false
      width: 4
      height: 4
      footprint: '[[-0.335,-0.185],[0.335,-0.185],[0.335,0.185],[-0.335,0.185]]'
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
        footprint_clearing_enabled: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: injected
        injected:
          topic: /test_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.3
          min_obstacle_height: 0.01
          max_obstacle_height: 1.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.4
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.01
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.15
      rolling_window: true
      width: 4
      height: 4
      footprint: '[[-0.335,-0.185],[0.335,-0.185],[0.335,0.185],[-0.335,0.185]]'
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
        footprint_clearing_enabled: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: injected
        injected:
          topic: /test_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.3
          min_obstacle_height: 0.01
          max_obstacle_height: 1.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.4
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity:
    - 0.4
    - 0.0
    - 0.3
    min_velocity:
    - 0.0
    - 0.0
    - -0.3
    max_accel:
    - 0.6
    - 0.0
    - 6.0
    max_decel:
    - -0.6
    - 0.0
    - -6.0
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.3
    enable_stamped_cmd_vel: false
nav_safety_gate:
  ros__parameters:
    use_sim_time: false
    enable_epoch_contract: false
    watchdog_timeout_ms: 200
    cmd_timeout_ms: 300
    cmd_vel_input_topic: /cmd_vel
    cmd_vel_output_topic: /cmd_vel_safe
    loc_status_topic: /lightning/loc_status
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    default_nav_to_pose_bt_xml: REQUIRED_AT_PREPARE
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names:
    - map_server
    - planner_server
    - controller_server
    - velocity_smoother
    - bt_navigator
